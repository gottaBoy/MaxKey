############################################################################ 
#                Kerberos Login configuration
############################################################################
#short name of user domain must be in upper case,eg:Sophon
sophon.support.kerberos.default.userdomain=Sophon
#short name of user domain must be in upper case,eg:Sophon.ORG
sophon.support.kerberos.default.fulluserdomain=Sophon.ORG
#last 8Bit crypto for Kerberos web Authentication 
sophon.support.kerberos.default.crypto=846KZSzYq56M6d5o
#Kerberos Authentication server RUL
sophon.support.kerberos.default.redirecturi=http://sso.Sophon.top/kerberos/authn/
############################################################################ 
#                HTTPHEADER Login configuration
############################################################################
sophon.support.httpheader.enable=false
sophon.support.httpheader.headername=header-user
# iv-user is for IBM Security Access Manager
#Sophon.httpheader.headername=iv-user

############################################################################ 
#                BASIC Login support configuration
############################################################################

sophon.support.basic.enable=false

#############################################################################
#                WsFederation Login support configuration
#identifier: the identifer for the ADFS server
#url: the login url for ADFS
#principal: the name of the attribute/assertion returned by ADFS that contains the principal's username.
#relyingParty: the identifier of the CAS Server as it has been configured in ADFS.
#tolerance: (optional) the amount of drift to allow when validating the timestamp on the token. Default: 10000 (ms)
#attributeMutator: (optional) a class (defined by you) that can modify the attributes/assertions returned by the ADFS server
#signingCertificate: ADFS's signing certificate used to validate the token/assertions issued by ADFS.
############################################################################

sophon.support.wsfederation.identifier=http://adfs.Sophon.top/adfs/services/trust
sophon.support.wsfederation.url=https://adfs.Sophon.top/adfs/ls/
sophon.support.wsfederation.principal=upn
sophon.support.wsfederation.relyingParty=urn:federation:connsec
sophon.support.wsfederation.signingCertificate=adfs-signing.crt
sophon.support.wsfederation.tolerance=10000
sophon.support.wsfederation.upn.suffix=Sophon.org
sophon.support.wsfederation.logoutUrl=https://adfs.Sophon.top/adfs/ls/?wa=wsignout1.0
#############################################################################

