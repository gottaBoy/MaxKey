  Sophon-frontend:
    image: Sophontop/Sophon-frontend:latest
    container_name: Sophon-frontend
    hostname: Sophon-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8527:8527"
    networks:
      - Sophon.top
      
  Sophon:
    image: Sophontop/Sophon:latest
    container_name: Sophon
    hostname: Sophon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=Sophon
      - DATABASE_USER=root
      - DATABASE_PWD=123456
    ports:
      - "9527:9527"
    networks:
      - Sophon.top

  Sophon-mgt:
    image: Sophontop/Sophon-mgt:latest
    container_name: Sophon-mgt
    hostname: Sophon-mgt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=Sophon
      - DATABASE_USER=root
      - DATABASE_PWD=123456
      - LOGIN_CAS_SERVER=http://Sophon-nginx/sign/authz/cas
    ports:
      - "9526:9526"
    networks:
      - Sophon.top
      
  Sophon-mgt-frontend:
    image: Sophontop/Sophon-mgt-frontend:latest
    container_name: Sophon-mgt-frontend
    hostname: Sophon-mgt-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8526:8526"
    networks:
      - Sophon.top
      
  Sophon-nginx:
    image: nginx:latest
    container_name: Sophon-nginx
    hostname: Sophon-nginx
    volumes:
      - ./docker-nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
    networks:
      - Sophon.top
