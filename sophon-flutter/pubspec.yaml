publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.4.3+1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.0
  mobile_scanner: ^7.1.3
  # permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  auth_totp: ^1.0.1
